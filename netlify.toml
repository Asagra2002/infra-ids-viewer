[build]
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "dist"

# SPA: todas las rutas sirven index.html para React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

[context.production]
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "dist"

[context.production.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

[context.fragments-v3-dev]
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "dist"

[context.fragments-v3-dev.environment]
  NPM_FLAGS = "--legacy-peer-deps"
